[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8.3"]
build-backend = "scikit_build_core.build"

[project]
name = "jump-consistent-hash"
description = "Implementation of the Jump Consistent Hash algorithm"
readme = "README.rst"
license = "MIT"
requires-python = ">=3.10"

classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
keywords = ["jump", "consistent", "hash", "jumphash", "algorithm"]

dynamic = ["version"]

[[project.authors]]
name = "Peter Lithammer"
email = "peter.lithammer@gmail.com"

[project.urls]
Source = "https://github.com/lithammer/python-jump-consistent-hash"
Issues = "https://github.com/lithammer/python-jump-consistent-hash/issues"
Changelog = "https://github.com/lithammer/python-jump-consistent-hash/releases"
Documentation = "https://github.com/lithammer/python-jump-consistent-hash#readme"

[dependency-groups]
dev = [
  "clang-format",
  "ty",
  "ruff",
  "pytest",
]

[tool.uv]
# uv keys the build on project metadata alone, so without these an edit to
# the C sources leaves a stale extension installed.
cache-keys = [
  { file = "pyproject.toml" },
  { file = "CMakeLists.txt" },
  { file = "src/jump/**/*.c" },
]

[tool.scikit-build]
build-dir = "build"
wheel.packages = ["src/jump"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.cibuildwheel]
test-command = "pytest {package}/tests"
test-requires = "pytest"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
order-by-type = true
